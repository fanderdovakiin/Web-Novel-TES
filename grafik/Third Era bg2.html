<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>TES III Morrowind Narrative Flow</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #080305;
      font-family: serif;
    }
    #chart {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="chart"></div>

      subtextStyle: {

        fontSize: 10,
        fontStyle: "italic"
      }
    },
    tooltip: {

        right: "5%",
