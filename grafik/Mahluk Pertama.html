<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Distribusi Esensi</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
    }
    #chart {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="chart"></div>

<script>
var chart = echarts.init(document.getElementById('chart'));

var option = {
  backgroundColor: {
    type: "radial",
    x: 0.5,
    y: 0.5,
    r: 0.5,
    colorStops: [
      { offset: 0, color: "#0d0d1a" },
      { offset: 1, color: "#050508" }
    ]
  },

  title: {
    text: "⚖ Distribusi Esensi Anu-Padomay ⚖",
    subtext: "Proporsi Stasis & Perubahan dalam Setiap Kelompok Et'Ada",
    left: "center",
    top: "2%",
    textStyle: {
      color: "#e6d3a3", // lebih soft
      fontFamily: "Cinzel, Georgia, serif",
      fontSize: 20,
      fontWeight: "bold",
      textShadowColor: "rgba(196,163,90,0.25)", // glow dikurangi
      textShadowBlur: 4
    },
    subtextStyle: {
      color: "#8f7f5f", // lebih kalem
      fontFamily: "Crimson Text, Georgia, serif",
      fontSize: 12,
      fontStyle: "italic"
    }
  },

  tooltip: {
    trigger: "axis",
    backgroundColor: "rgba(15, 15, 30, 0.95)",
    borderColor: "#d4b067",
    textStyle: {
      color: "#e8dcc8",
      fontSize: 12
    }
  },

  legend: {
    data: ["Esensi Anu (Stasis)", "Esensi Padomay (Perubahan)", "Interplay / Kebebasan"],
    bottom: "3%",
    textStyle: {
      color: "#a89770", // lebih redup
      fontSize: 11
    }
  },

  xAxis: {
    type: "category",
    data: [
      "✦ Anu-El\n(Akatosh)",
      "⚜ Aedra\n(Eight Divines)",
      "✧ Magna-Ge\n(Stars)",
      "◈ Lorkhan\n(Missing God)",
      "☽ Daedra\n(16 Princes)",
      "◆ Sithis\n(Void)"
    ],
    axisLabel: {
      color: "#a89770",
      fontSize: 10
    }
  },

  yAxis: {
    type: "value",
    max: 100,
    name: "Proporsi Esensi (%)",
    nameTextStyle: {
      color: "#8a7a5a",
      fontSize: 11
    },
    axisLabel: {
      color: "#777",
      fontSize: 10
    }
  },

  series: [
    {
      name: "Esensi Anu (Stasis)",
      type: "bar",
      stack: "total",
      data: [80, 55, 40, 20, 10, 0]
    },
    {
      name: "Esensi Padomay (Perubahan)",
      type: "bar",
      stack: "total",
      data: [5, 15, 35, 60, 75, 90]
    },
    {
      name: "Interplay / Kebebasan",
      type: "bar",
      stack: "total",
      data: [15, 30, 25, 20, 15, 10]
    }
  ]
};

chart.setOption(option);
</script>

</body>
</html>
