<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Third Era Timeline</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #050310;
      font-family: serif;
    }
    #chart {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="chart"></div>

<script>
  var chart = echarts.init(document.getElementById('chart'));

  var option = {
    backgroundColor: "#050310",
    title: {
      text: "Third Era Bagian 1: Timeline Septim Dynasty",
      subtext: "3E 0 — 3E 399 · Dari Tiber Septim hingga akhir Simulacrum",
      left: "center",
      top: 10,
      textStyle: {
        color: "#c4a35a",
        fontFamily: "serif",
        fontSize: 14
      },
      subtextStyle: {
        color: "#806030",
        fontFamily: "serif",
        fontSize: 10,
        fontStyle: "italic"
      }
    },
    tooltip: {
      trigger: "axis",
      backgroundColor: "#080510",
      borderColor: "#8060a0",
      textStyle: {
        color: "#e0d5c0",
        fontFamily: "serif",
        fontSize: 10
      }
    },
    legend: {
      data: [
        "Kekuatan Kekaisaran (0-100)",
        "Ancaman Internal (0-100)",
        "Krisis Supernatural (0-100)"
      ],
      bottom: 10,
      textStyle: {
        color: "#aaa",
        fontFamily: "serif",
        fontSize: 10
      }
    },
    grid: {
      left: "10%",
      right: "8%",
      top: "20%",
      bottom: "18%"
    },
    xAxis: {
      type: "category",
      data: [
        "3E 0\nTiber",
        "3E 38\nPelagius I",
        "3E 100",
        "3E 145\nPelagius III",
        "3E 153\nKatariah",
        "3E 200",
        "3E 268\nUriel V",
        "3E 290",
        "3E 368\nUriel VII",
        "3E 389\nSimulacrum",
        "3E 399\nFreedom",
        "3E 417\nWarp"
      ],
      axisLabel: {
        color: "#888",
        fontFamily: "serif",
        fontSize: 8,
        interval: 0
      },
      axisLine: {
        lineStyle: { color: "#2a1540" }
      }
    },
    yAxis: {
      type: "value",
      max: 100,
      axisLabel: {
        color: "#666",
        fontFamily: "serif"
      },
      axisLine: {
        lineStyle: { color: "#2a1540" }
      },
      splitLine: {
        lineStyle: { color: "#0d0820" }
      }
    },
    series: [
      {
        name: "Kekuatan Kekaisaran (0-100)",
        type: "line",
        data: [100,85,80,60,72,78,75,68,80,45,75,70],
        smooth: true,
        lineStyle: {
          color: "#f5e08a",
          width: 3
        },
        itemStyle: {
          color: "#f5e08a"
        },
        areaStyle: {
          color: {
            type: "linear",
            x: 0, y: 0, x2: 0, y2: 1,
            colorStops: [
              {offset: 0, color: "rgba(245,224,138,0.25)"},
              {offset: 1, color: "rgba(245,224,138,0)"}
            ]
          }
        },
        symbolSize: 8
      },
      {
        name: "Ancaman Internal (0-100)",
        type: "line",
        data: [10,20,25,55,30,20,30,35,20,85,25,40],
        smooth: true,
        lineStyle: {
          color: "#c05050",
          width: 2.5,
          type: "dashed"
        },
        itemStyle: {
          color: "#d06060"
        },
        symbolSize: 8
      },
      {
        name: "Krisis Supernatural (0-100)",
        type: "line",
        data: [30,25,15,20,15,10,15,20,15,75,20,60],
        smooth: true,
        lineStyle: {
          color: "#8060a0",
          width: 2
        },
        itemStyle: {
          color: "#a080c0"
        },
        areaStyle: {
          color: {
            type: "linear",
            x: 0, y: 0, x2: 0, y2: 1,
            colorStops: [
              {offset: 0, color: "rgba(128,96,160,0.2)"},
              {offset: 1, color: "rgba(128,96,160,0)"}
            ]
          }
        },
        symbolSize: 6
      }
    ],
    markLine: {
      data: [
        {
          xAxis: 9,
          lineStyle: { color: "#c05050", width: 2 },
          label: {
            formatter: "Simulacrum\nBegins",
            color: "#c05050",
            fontSize: 9
          }
        }
      ]
    }
  };

  chart.setOption(option);

  window.addEventListener('resize', function () {
    chart.resize();
  });
</script>

</body>
</html>
