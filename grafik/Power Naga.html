<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafik Naga Tamriel</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* Latar transparan agar menyatu dengan background webnovel-mu */
            background-color: transparent; 
            overflow: hidden; /* Mencegah munculnya scrollbar ganda di iframe */
        }
        #chart-container {
            width: 100%;
            height: 500px;
        }
    </style>
</head>
<body>

    <div id="chart-container"></div>

    <script>
        // Inisialisasi ECharts di dalam wadah
        var chartDom = document.getElementById('chart-container');
        var myChart = echarts.init(chartDom);
        var option;

        // Opsi Data & Desain (Sudah Diperbaiki)
        option = {
            backgroundColor: "transparent", // Dibuat transparan agar membaur
            title: {
                text: "Naga-Naga Terkenal Tamriel",
                subtext: "Perbandingan Kekuatan & Signifikansi Dalam Sejarah",
                left: "center",
                top: 10,
                textStyle: {
                    color: "#d4af37", // Warna Emas Klasik
                    fontFamily: "'Cinzel', serif",
                    fontSize: 20,
                    fontWeight: "bold",
                    textShadowBlur: 5,
                    textShadowColor: "rgba(0,0,0,0.5)"
                },
                subtextStyle: {
                    color: "#c09060",
                    fontFamily: "'Merriweather', serif",
                    fontSize: 12,
                    fontStyle: "italic"
                }
            },
            tooltip: {
                trigger: "item",
                backgroundColor: "rgba(12, 8, 16, 0.9)", // Sedikit transparan
                borderColor: "#d4af37",
                borderWidth: 1,
                padding: 10,
                textStyle: {
                    color: "#e0d5c0",
                    fontFamily: "'Poppins', sans-serif",
                    fontSize: 12
                }
            },
            legend: {
                data: ["ALDUIN", "PAARTHURNAX", "ODAHVIING", "DURNEHVIIR", "NAFAALILARGUS"],
                bottom: 10,
                itemGap: 15, // Jarak antar nama naga diperlebar agar rapi
                textStyle: {
                    color: "#c4a35a",
                    fontFamily: "'Merriweather', serif",
                    fontSize: 11,
                    fontWeight: "bold"
                }
            },
            radar: {
                indicator: [
                    {name: "Raw Power", max: 10},
                    {name: "Historical\nImpact", max: 10},
                    {name: "Intelligence\n& Wisdom", max: 10},
                    {name: "Age &\nExperience", max: 10},
                    {name: "Thu'um\nMastery", max: 10},
                    {name: "Narrative\nSignificance", max: 10},
                    {name: "Moral\nComplexity", max: 10}
                ],
                center: ["50%", "52%"], // Agak dinaikkan agar tidak menabrak Legend di bawah
                radius: "55%", // Dikecilkan sedikit agar label tidak terpotong di HP
                axisName: {
                    color: "#d4af37",
                    fontFamily: "'Cinzel', serif",
                    fontSize: 11,
                    fontWeight: "bold",
                    borderRadius: 3,
                    padding: [3, 5]
                },
                axisLine: { lineStyle: { color: "#3a2a20" } },
                splitLine: { lineStyle: { color: "#2c1e16" } },
                splitArea: { areaStyle: { color: ["rgba(0,0,0,0.2)", "rgba(20,15,10,0.1)"] } }
            },
            series: [
                {
                    type: "radar",
                    data: [
                        {
                            name: "ALDUIN",
                            value: [10, 10, 8, 10, 10, 10, 6],
                            symbol: "circle",
                            symbolSize: 6,
                            lineStyle: {color: "#cc0000", width: 3},
                            areaStyle: {color: "rgba(200,0,0,0.2)"},
                            itemStyle: {color: "#cc0000"}
                        },
                        {
                            name: "PAARTHURNAX",
                            value: [8, 9, 10, 10, 9, 10, 10],
                            symbol: "diamond",
                            symbolSize: 7,
                            lineStyle: {color: "#c09060", width: 3},
                            areaStyle: {color: "rgba(192,144,96,0.2)"},
                            itemStyle: {color: "#c09060"}
                        },
                        {
                            name: "ODAHVIING",
                            value: [7, 7, 7, 7, 7, 8, 7],
                            symbol: "triangle",
                            symbolSize: 6,
                            lineStyle: {color: "#c04020", width: 2},
                            areaStyle: {color: "rgba(192,64,32,0.15)"},
                            itemStyle: {color: "#c04020"}
                        },
                        {
                            name: "DURNEHVIIR",
                            value: [7, 6, 8, 9, 8, 9, 9],
                            symbol: "rect",
                            symbolSize: 6,
                            lineStyle: {color: "#5080c0", width: 2},
                            areaStyle: {color: "rgba(80,128,192,0.15)"},
                            itemStyle: {color: "#5080c0"}
                        },
                        {
                            name: "NAFAALILARGUS",
                            value: [7, 7, 6, 7, 7, 6, 5],
                            symbol: "pin",
                            symbolSize: 7,
                            lineStyle: {color: "#c09040", width: 2, type: "dashed"},
                            areaStyle: {color: "rgba(192,144,64,0.1)"},
                            itemStyle: {color: "#c09040"}
                        }
                    ]
                }
            ]
        };

        // Menjalankan grafik dengan opsi di atas
        option && myChart.setOption(option);

        // Membuat grafik responsif jika ukuran jendela browser berubah
        window.addEventListener('resize', function() {
            myChart.resize();
        });
    </script>
</body>
</html>
