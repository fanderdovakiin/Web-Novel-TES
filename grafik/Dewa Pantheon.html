<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pantheon Tamriel</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    body {
      margin: 0;
      background-color: #040408;
      font-family: serif;
    }
    #chart {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="chart"></div>

<script>
  var chart = echarts.init(document.getElementById('chart'));

  var option = {
    backgroundColor: "#040408",
    title: {
      text: "Pantheon Tamriel — Komparasi Elemen Kunci",
      subtext: "Setiap tradisi keagamaan dan elemen-elemen fundamentalnya",
      left: "center",
      top: 10,
      textStyle: {
        color: "#c4a35a",
        fontFamily: "serif",
        fontSize: 14
      },
      subtextStyle: {
        color: "#806030",
        fontFamily: "serif",
        fontSize: 10,
        fontStyle: "italic"
      }
    },
    tooltip: {
      trigger: "axis",
      backgroundColor: "#080510",
      borderColor: "#c4a35a",
      textStyle: {
        color: "#e0d5c0",
        fontFamily: "serif",
        fontSize: 10
      }
    },
    legend: {
      data: ["Nordic", "Khajiit", "Bosmer", "Redguard", "Argonian", "Dunmer"],
      bottom: 8,
      textStyle: {
        color: "#aaa",
        fontFamily: "serif",
        fontSize: 10
      }
    },
    radar: {
      indicator: [
        {name: "Connection to\nNature/Cosmos", max: 10},
        {name: "Organized\nHierarchy", max: 10},
        {name: "Afterlife\nDefinition", max: 10},
        {name: "Daedric\nInvolvement", max: 10},
        {name: "Heroism /\nWarrior Ethos", max: 10},
        {name: "Mystical /\nEsoteric", max: 10},
        {name: "Connection\nto Mortality", max: 10},
        {name: "Integration with\nDaily Life", max: 10}
      ],
      center: ["50%", "55%"],
      radius: "60%",
      axisName: {
        color: "#c4a35a",
        fontFamily: "serif",
        fontSize: 9
      },
      axisLine: {
        lineStyle: { color: "#2a2030" }
      },
      splitLine: {
        lineStyle: { color: "#1a1525" }
      },
      splitArea: {
        areaStyle: {
          color: ["rgba(8,6,12,0.5)", "rgba(12,10,18,0.5)"]
        }
      }
    },
    series: [
      {
        type: "radar",
        data: [
          {
            name: "Nordic",
            value: [7, 5, 9, 3, 10, 6, 8, 7],
            symbol: "circle",
            symbolSize: 5,
            lineStyle: {color: "#6090c0", width: 2},
            areaStyle: {color: "rgba(96,144,192,0.12)"},
            itemStyle: {color: "#6090c0"}
          },
          {
            name: "Khajiit",
            value: [9, 6, 7, 6, 4, 9, 6, 9],
            symbol: "diamond",
            symbolSize: 5,
            lineStyle: {color: "#d09040", width: 2},
            areaStyle: {color: "rgba(208,144,64,0.12)"},
            itemStyle: {color: "#d09040"}
          },
          {
            name: "Bosmer",
            value: [10, 4, 6, 4, 5, 7, 5, 10],
            symbol: "triangle",
            symbolSize: 5,
            lineStyle: {color: "#60a040", width: 2},
            areaStyle: {color: "rgba(96,160,64,0.12)"},
            itemStyle: {color: "#60a040"}
          },
          {
            name: "Redguard",
            value: [6, 5, 8, 3, 9, 8, 7, 6],
            symbol: "rect",
            symbolSize: 5,
            lineStyle: {color: "#d0a040", width: 2},
            areaStyle: {color: "rgba(208,160,64,0.12)"},
            itemStyle: {color: "#d0a040"}
          },
          {
            name: "Argonian",
            value: [10, 3, 9, 4, 4, 10, 9, 10],
            symbol: "pin",
            symbolSize: 5,
            lineStyle: {color: "#40c040", width: 2},
            areaStyle: {color: "rgba(64,192,64,0.12)"},
            itemStyle: {color: "#40c040"}
          },
          {
            name: "Dunmer",
            value: [5, 9, 6, 9, 5, 8, 6, 8],
            symbol: "arrow",
            symbolSize: 5,
            lineStyle: {color: "#9070b0", width: 2},
            areaStyle: {color: "rgba(144,112,176,0.12)"},
            itemStyle: {color: "#9070b0"}
          }
        ]
      }
    ]
  };

  chart.setOption(option);

  window.addEventListener('resize', function () {
    chart.resize();
  });
</script>

</body>
</html>
