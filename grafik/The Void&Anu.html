<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kosmogoni Aurbis</title>

  <!-- ECharts CDN -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #0a0a0a;
    }
    #chart {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="chart"></div>

<script>
  var chart = echarts.init(document.getElementById('chart'));

  var option = {
    "backgroundColor": "#0a0a0a",
    "title": {
      "text": "Kosmogoni Aurbis: Dari Void ke Penciptaan",
      "subtext": "Timeline metaforis — peristiwa sebelum waktu linear",
      "left": "center",
      "top": "2%",
      "textStyle": {
        "color": "#c4a35a",
        "fontFamily": "Georgia, serif",
        "fontSize": 22,
        "fontWeight": "bold"
      },
      "subtextStyle": {
        "color": "#999",
        "fontFamily": "Georgia, serif",
        "fontSize": 13,
        "fontStyle": "italic"
      }
    },
    "tooltip": {
      "trigger": "axis",
      "backgroundColor": "rgba(26, 26, 46, 0.95)",
      "borderColor": "#c4a35a",
      "borderWidth": 2,
      "textStyle": {
        "color": "#e0d5c0",
        "fontFamily": "Georgia, serif",
        "fontSize": 13
      },
      "axisPointer": {
        "type": "cross",
        "lineStyle": {
          "color": "#c4a35a",
          "width": 1,
          "type": "dashed"
        },
        "crossStyle": {
          "color": "#c4a35a"
        }
      },
      "formatter": function (params) {
        let result = params[0].name + '<br/>';
        params.forEach(item => {
          result += item.marker + ' ' + item.seriesName + ': ' + item.value + '<br/>';
        });
        return result;
      }
    },
    "legend": {
      "data": ["Esensi Anu (Stasis)", "Esensi Padomay (Perubahan)", "Interplay (Nir/Aurbis)"],
      "bottom": "3%",
      "textStyle": {
        "color": "#bbb",
        "fontFamily": "Georgia, serif",
        "fontSize": 12
      },
      "itemWidth": 30,
      "itemHeight": 14,
      "itemGap": 20
    },
    "grid": {
      "left": "8%",
      "right": "6%",
      "bottom": "16%",
      "top": "20%",
      "containLabel": true
    },
    "xAxis": {
      "type": "category",
      "data": [
        "Void","Anu & Padomay","Nir Terlahir","Pertarungan\nPertama",
        "12 Dunia\nTercipta","12 Dunia\nHancur","Et'Ada\nTerlahir","Aurbis\nTerbentuk"
      ],
      "axisLine": { "lineStyle": { "color": "#555", "width": 2 }},
      "axisTick": { "show": true, "lineStyle": { "color": "#555" }},
      "axisLabel": {
        "color": "#bbb",
        "fontFamily": "Georgia, serif",
        "fontSize": 11,
        "interval": 0,
        "rotate": 0,
        "margin": 12
      }
    },
    "yAxis": {
      "type": "value",
      "name": "Kompleksitas Keberadaan",
      "nameLocation": "middle",
      "nameGap": 50,
      "nameTextStyle": {
        "color": "#999",
        "fontFamily": "Georgia, serif",
        "fontSize": 13,
        "fontStyle": "italic"
      },
      "axisLine": { "show": true, "lineStyle": { "color": "#555", "width": 2 }},
      "axisTick": { "show": true, "lineStyle": { "color": "#555" }},
      "axisLabel": { "color": "#888", "fontFamily": "Georgia, serif", "fontSize": 11 },
      "splitLine": { "lineStyle": { "color": "#222", "type": "dashed" }}
    },
    "series": [
      {
        "name": "Esensi Anu (Stasis)",
        "type": "line",
        "data": [0,50,60,45,70,40,55,60],
        "smooth": 0.4,
        "symbol": "circle",
        "symbolSize": 8,
        "lineStyle": {"color":"#f0e6d3","width":3},
        "itemStyle": {"color":"#f0e6d3"}
      },
      {
        "name": "Esensi Padomay (Perubahan)",
        "type": "line",
        "data": [0,50,40,80,60,85,65,55],
        "smooth": 0.4,
        "symbol": "circle",
        "symbolSize": 8,
        "lineStyle": {"color":"#8040c0","width":3},
        "itemStyle": {"color":"#8040c0"}
      },
      {
        "name": "Interplay (Nir/Aurbis)",
        "type": "line",
        "data": [0,10,50,30,65,20,80,100],
        "smooth": 0.4,
        "symbol": "diamond",
        "symbolSize": 10,
        "lineStyle": {"color":"#c4a35a","width":3,"type":"dashed"},
        "itemStyle": {"color":"#c4a35a"}
      }
    ],
    "animation": true,
    "animationDuration": 2000,
    "animationEasing": "cubicInOut"
  };

  chart.setOption(option);

  window.addEventListener('resize', function () {
    chart.resize();
  });
</script>

</body>
</html>
