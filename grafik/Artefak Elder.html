<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Elder Scrolls Vision Paradox</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #040406;
      font-family: serif;
    }
    #chart {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>
<div id="chart"></div>

<script>
var chart = echarts.init(document.getElementById('chart'));

var option = {
  backgroundColor: "#040406",

  title: {
    text: "Elder Scrolls — Tingkat Kesulitan Pembacaan vs Kejelasan Visi",
    subtext: "Paradoks Moth Priest: semakin buta, semakin jelas melihat",
    left: "center",
    top: 10,
    textStyle: { color: "#f0e8d0", fontSize: 14 },
    subtextStyle: { color: "#c0a880", fontSize: 10, fontStyle: "italic" }
  },

  tooltip: {
    trigger: "axis",
    backgroundColor: "#0a0808",
    borderColor: "#f0e8d0",
    textStyle: { color: "#f0e8d0" },
    formatter: function(params) {
      let text = params[0].axisValue + "<br/>";
      params.forEach(p => {
        text += p.marker + " " + p.seriesName + ": " + p.value + "%<br/>";
      });
      return text;
    }
  },

  legend: {
    data: ["Physical Sight", "Scroll Vision", "Training Years"],
    bottom: 8,
    textStyle: { color: "#c0a880" }
  },

  grid: {
    left: "12%",
    right: "8%",
    top: "20%",
    bottom: "18%"
  },

  xAxis: {
    type: "category",
    data: [
      "Untrained\n(1st contact)",
      "Novice\n(1-5)",
      "Student\n(5-10)",
      "Apprentice\n(10-20)",
      "Scholar\n(20-40)",
      "Elder\n(40-60)",
      "Master\n(60+)",
      "Archpriest\n(Blind)"
    ],
    axisLabel: {
      color: "#c0a880",
      fontSize: 8,
      interval: 0
    },
    axisLine: { lineStyle: { color: "#2a2020" } }
  },

  yAxis: {
    type: "value",
    max: 100,
    axisLabel: {
      color: "#806840",
      formatter: "{value}%"
    },
    axisLine: { lineStyle: { color: "#2a2020" } },
    splitLine: { lineStyle: { color: "#111" } }
  },

  series: [
    {
      name: "Training Years",
      type: "bar",
      data: [0, 5, 10, 20, 40, 60, 80, 100],
      barWidth: "30%",
      itemStyle: {
        color: {
          type: "linear",
          x: 0, y: 0, x2: 0, y2: 1,
          colorStops: [
            {offset: 0, color: "rgba(192,160,80,0.4)"},
            {offset: 1, color: "rgba(128,96,32,0.2)"}
          ]
        }
      }
    },

    {
      name: "Physical Sight",
      type: "line",
      data: [100, 95, 85, 70, 50, 25, 8, 0],
      smooth: true,
      symbolSize: 8,
      lineStyle: { color: "#d0c8a0", width: 2.5 },
      itemStyle: { color: "#e0d8b0" },
      areaStyle: {
        color: {
          type: "linear",
          x: 0, y: 0, x2: 0, y2: 1,
          colorStops: [
            {offset: 0, color: "rgba(220,216,180,0.2)"},
            {offset: 1, color: "rgba(220,216,180,0)"}
          ]
        }
      }
    },

    {
      name: "Scroll Vision",
      type: "line",
      data: [0, 5, 18, 35, 55, 75, 90, 100],
      smooth: true,
      symbolSize: 8,
      lineStyle: { color: "#80c0e0", width: 2.5 },
      itemStyle: { color: "#a0d0f0" },
      areaStyle: {
        color: {
          type: "linear",
          x: 0, y: 0, x2: 0, y2: 1,
          colorStops: [
            {offset: 0, color: "rgba(128,192,224,0.2)"},
            {offset: 1, color: "rgba(128,192,224,0)"}
          ]
        }
      },

      // 🔥 MARK LINE DIPERBAIKI (HARUS DI DALAM SERIES)
      markLine: {
        data: [
          {
            xAxis: 4,
            lineStyle: {
              color: "#ff8040",
              width: 1.5,
              type: "dashed"
            },
            label: {
              formatter: "Crossover Point",
              color: "#ff8040"
            }
          }
        ]
      }
    }
  ]
};

chart.setOption(option);
</script>
</body>
</html>
