<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tiga Provinsi Selatan</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #040608;
      font-family: Georgia, serif;
    }
    #chart {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="chart"></div>

<script>
const chart = echarts.init(document.getElementById('chart'));

const option = {
  backgroundColor: "#040608",
  title: {
    text: "Tiga Provinsi Selatan — Karakteristik Perbandingan",
    subtext: "Summerset · Valenwood · Elsweyr",
    left: "center",
    top: 20,
    textStyle: {
      color: "#c4a35a",
      fontFamily: "Georgia, serif",
      fontSize: 13
    },
    subtextStyle: {
      color: "#806030",
      fontFamily: "Georgia, serif",
      fontSize: 10,
      fontStyle: "italic"
    }
  },
  tooltip: {
    trigger: "item",
    backgroundColor: "#080510",
    borderColor: "#c4a35a",
    textStyle: {
      color: "#e0d5c0",
      fontFamily: "Georgia, serif",
      fontSize: 10
    }
  },
  legend: {
    data: [
      "Summerset (Altmer)",
      "Valenwood (Bosmer)",
      "Elsweyr (Khajiit)"
    ],
    bottom: 20,
    textStyle: {
      color: "#aaa",
      fontFamily: "Georgia, serif",
      fontSize: 10
    }
  },
  radar: {
    indicator: [
      {name: "Magicka", max: 100},
      {name: "Military", max: 100},
      {name: "Economy", max: 100},
      {name: "Culture", max: 100},
      {name: "Nature", max: 100},
      {name: "Politics", max: 100},
      {name: "Openness", max: 100},
      {name: "Diplomacy", max: 100}
    ],
    center: ["50%", "58%"],
    radius: "52%",
    axisName: {
      color: "#c4a35a",
      fontFamily: "Georgia, serif",
      fontSize: 8
    },
    axisLine: {
      lineStyle: { color: "#2a2030" }
    },
    splitLine: {
      lineStyle: { color: "#1a1525" }
    },
    splitArea: {
      areaStyle: {
        color: ["rgba(8,6,12,0.5)", "rgba(12,10,18,0.5)"]
      }
    }
  },
  series: [
    {
      type: "radar",
      data: [
        {
          name: "Summerset (Altmer)",
          value: [98, 70, 85, 95, 40, 90, 15, 75],
          symbolSize: 5,
          lineStyle: {color: "#90c0e0", width: 2},
          areaStyle: {color: "rgba(144,192,224,0.15)"},
          itemStyle: {color: "#90c0e0"}
        },
        {
          name: "Valenwood (Bosmer)",
          value: [55, 65, 50, 85, 98, 45, 35, 40],
          symbolSize: 5,
          lineStyle: {color: "#60a040", width: 2},
          areaStyle: {color: "rgba(96,160,64,0.15)"},
          itemStyle: {color: "#60a040"}
        },
        {
          name: "Elsweyr (Khajiit)",
          value: [45, 55, 80, 50, 60, 50, 65, 85],
          symbolSize: 5,
          lineStyle: {color: "#d09040", width: 2},
          areaStyle: {color: "rgba(208,144,64,0.15)"},
          itemStyle: {color: "#d09040"}
        }
      ]
    }
  ]
};

chart.setOption(option);

window.addEventListener('resize', () => {
  chart.resize();
});
</script>

</body>
</html>
