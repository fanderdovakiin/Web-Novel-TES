<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Perbandingan Strategis Provinsi</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #040508;
      font-family: Georgia, serif;
    }
    #chart {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="chart"></div>

<script>
const chart = echarts.init(document.getElementById('chart'));

const option = {
  backgroundColor: "#040508",
  title: {
    text: "Hammerfell · High Rock · Black Marsh",
    subtext: "Perbandingan Strategis",
    left: "center",
    top: 20,
    textStyle: {
      color: "#c4a35a",
      fontFamily: "Georgia, serif",
      fontSize: 13
    },
    subtextStyle: {
      color: "#806030",
      fontFamily: "Georgia, serif",
      fontSize: 10,
      fontStyle: "italic"
    }
  },
  tooltip: {
    trigger: "axis",
    backgroundColor: "#080510",
    borderColor: "#c4a35a",
    textStyle: {
      color: "#e0d5c0",
      fontFamily: "Georgia, serif",
      fontSize: 10
    },
    axisPointer: { type: "shadow" }
  },
  legend: {
    data: [
      "Hammerfell (Redguard)",
      "High Rock (Breton)",
      "Black Marsh (Argonian)"
    ],
    bottom: 20,
    textStyle: {
      color: "#aaa",
      fontFamily: "Georgia, serif",
      fontSize: 10
    }
  },
  grid: {
    left: "28%",   // diperbesar biar label kiri aman
    right: "5%",
    top: "20%",
    bottom: "18%"
  },
  xAxis: {
    type: "value",
    max: 100,
    axisLabel: {
      color: "#666",
      fontFamily: "Georgia, serif"
    },
    axisLine: { lineStyle: { color: "#2a2030" } },
    splitLine: { lineStyle: { color: "#111" } }
  },
  yAxis: {
    type: "category",
    data: [
      "Military",
      "Diplomacy",
      "Magic",
      "Economy",
      "Environment",
      "Unity",
      "Culture",
      "Independence"
    ],
    axisLabel: {
      color: "#c4a35a",
      fontFamily: "Georgia, serif",
      fontSize: 9
    },
    axisLine: { lineStyle: { color: "#2a2030" } }
  },
  series: [
    {
      name: "Hammerfell (Redguard)",
      type: "bar",
      data: [95, 55, 50, 70, 60, 45, 90, 98],
      itemStyle: {
        color: {
          type: "linear",
          x: 0, y: 0, x2: 1, y2: 0,
          colorStops: [
            {offset: 0, color: "#d0a040"},
            {offset: 1, color: "#806020"}
          ]
        }
      },
      barWidth: "20%"
    },
    {
      name: "High Rock (Breton)",
      type: "bar",
      data: [55, 95, 80, 85, 40, 20, 65, 60],
      itemStyle: {
        color: {
          type: "linear",
          x: 0, y: 0, x2: 1, y2: 0,
          colorStops: [
            {offset: 0, color: "#8090b0"},
            {offset: 1, color: "#405070"}
          ]
        }
      },
      barWidth: "20%"
    },
    {
      name: "Black Marsh (Argonian)",
      type: "bar",
      data: [55, 35, 50, 40, 100, 65, 85, 95],
      itemStyle: {
        color: {
          type: "linear",
          x: 0, y: 0, x2: 1, y2: 0,
          colorStops: [
            {offset: 0, color: "#40a040"},
            {offset: 1, color: "#206020"}
          ]
        }
      },
      barWidth: "20%"
    }
  ]
};

chart.setOption(option);

window.addEventListener('resize', () => {
  chart.resize();
});
</script>

</body>
</html>
