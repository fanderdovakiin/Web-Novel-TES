<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Daedric Princes</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5"></script>
  <style>
    body {
      margin: 0;
      background: #040208;
      font-family: Georgia, serif;
    }

    #chart {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="chart"></div>

<script>
const chart = echarts.init(document.getElementById("chart"));

const option = {
  backgroundColor: "#040208",

  title: {
    text: "16 Daedric Princes",
    subtext: "Domain & tingkat ancaman terhadap Mundus",
    left: "center",
    top: 10,
    textStyle: {
      color: "#a060ff",
      fontSize: 16,
      fontFamily: "Georgia, serif"
    },
    subtextStyle: {
      color: "#7050a0",
      fontSize: 11
    }
  },

  tooltip: {
    trigger: "item",
    backgroundColor: "#080310",
    textStyle: { color: "#e0d5c0" }
  },

  series: [{
    type: "graph",
    layout: "circular",

    circular: {
      rotateLabel: false
    },

    roam: true,

    label: {
      show: true,
      color: "#ddd",
      fontSize: 11,
      overflow: "truncate"
    },

    data: [
      {name:"Azura", symbolSize:36, itemStyle:{color:"#c060c0"}},
      {name:"Boethiah", symbolSize:32, itemStyle:{color:"#a030a0"}},
      {name:"Clavicus Vile", symbolSize:30, itemStyle:{color:"#8040a0"}},
      {name:"Hermaeus Mora", symbolSize:34, itemStyle:{color:"#208030"}},
      {name:"Hircine", symbolSize:30, itemStyle:{color:"#a06030"}},
      {name:"Jyggalag", symbolSize:26, itemStyle:{color:"#c0c0d0"}},
      {name:"Malacath", symbolSize:28, itemStyle:{color:"#807050"}},
      {name:"Mehrunes Dagon", symbolSize:42, itemStyle:{color:"#cc2200"}},
      {name:"Mephala", symbolSize:30, itemStyle:{color:"#803080"}},
      {name:"Meridia", symbolSize:28, itemStyle:{color:"#c0c020"}},
      {name:"Molag Bal", symbolSize:40, itemStyle:{color:"#8820a0"}},
      {name:"Namira", symbolSize:24, itemStyle:{color:"#404040"}},
      {name:"Nocturnal", symbolSize:28, itemStyle:{color:"#303060"}},
      {name:"Peryite", symbolSize:24, itemStyle:{color:"#408040"}},
      {name:"Sanguine", symbolSize:26, itemStyle:{color:"#a02060"}},
      {name:"Sheogorath", symbolSize:36, itemStyle:{color:"#9050d0"}},
      {name:"Vaermina", symbolSize:26, itemStyle:{color:"#505090"}}
    ],

    links: [
      {source:"Jyggalag", target:"Sheogorath"},
      {source:"Molag Bal", target:"Mehrunes Dagon"},
      {source:"Boethiah", target:"Malacath"},
      {source:"Azura", target:"Boethiah"},
      {source:"Mephala", target:"Boethiah"},
      {source:"Nocturnal", target:"Mephala"},
      {source:"Hermaeus Mora", target:"Molag Bal"},
      {source:"Hircine", target:"Malacath"},
      {source:"Meridia", target:"Mehrunes Dagon"},
      {source:"Sanguine", target:"Clavicus Vile"},
      {source:"Vaermina", target:"Sheogorath"},
      {source:"Peryite", target:"Mehrunes Dagon"}
    ],

    lineStyle: {
      color: "#888",
      opacity: 0.6,
      width: 1.5,
      curveness: 0.3
    },

    emphasis: {
      focus: "adjacency",
      lineStyle: { width: 3 }
    }
  }]
};

chart.setOption(option);

window.addEventListener("resize", () => chart.resize());
</script>

</body>
</html>
