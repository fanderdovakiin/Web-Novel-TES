<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Fourth Era Chart</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=EB+Garamond&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

<style>
body {
  margin: 0;
  background: #030508;
  font-family: 'EB Garamond', serif;
}
#chart {
  width: 100%;
  height: 100vh;
}
</style>
</head>
<body>

<div id="chart"></div>

<script>
var chart = echarts.init(document.getElementById('chart'));

var option = {
  backgroundColor: "#030508",

  title: {
    text: "Fourth Era — Power & Crisis",
    subtext: "4E 0 – 4E 201",
    left: "center",
    textStyle: {
      color: "#c4a35a",
      fontFamily: "Cinzel",
      fontSize: 18
    },
    subtextStyle: {
      color: "#806030",
      fontSize: 12
    }
  },

  tooltip: { trigger: "axis" },

  legend: {
    bottom: 10,
    textStyle: {
      color: "#aaa",
      fontSize: 11
    }
  },

  grid: {
    left: "10%",
    right: "5%",
    top: "20%",
    bottom: "22%" // 🔥 tambah ruang bawah
  },

  xAxis: {
    type: "category",

    // 🔥 DIPERSINGKAT (ini penting banget)
    data: [
      "4E 0",
      "4E 5",
      "4E 6",
      "4E 22",
      "4E 29",
      "4E 98",
      "4E 100",
      "4E 171",
      "4E 175",
      "4E 180",
      "4E 201"
    ],

    axisLabel: {
      color: "#aaa",
      fontFamily: "EB Garamond",
      fontSize: 10,

      rotate: 30,         // 🔥 biar tidak tabrakan
      margin: 12,

      width: 60,
      overflow: "break",
      lineHeight: 12
    },

    axisLine: {
      lineStyle: { color: "#2a2030" }
    }
  },

  yAxis: {
    type: "value",
    max: 100,
    name: "Power / Intensity",
    nameTextStyle: {
      color: "#888",
      fontSize: 11
    },
    axisLabel: {
      color: "#777"
    },
    splitLine: {
      lineStyle: { color: "#111" }
    }
  },

  series: [
    {
      name: "Empire",
      type: "line",
      data: [60,45,40,38,35,40,42,50,40,35,28],
      smooth: true,
      lineStyle: { color: "#c4a35a", width: 2.5 },
      itemStyle: { color: "#c4a35a" },
      symbolSize: 7
    },
    {
      name: "Dominion",
      type: "line",
      data: [20,25,28,30,50,55,60,75,65,62,70],
      smooth: true,
      lineStyle: { color: "#f5e08a", width: 2.5, type: "dashed" },
      itemStyle: { color: "#f0d870" },
      symbolSize: 7
    },
    {
      name: "Skyrim Stability",
      type: "line",
      data: [65,60,55,58,55,58,60,52,45,40,30],
      smooth: true,
      lineStyle: { color: "#6090c0", width: 2 },
      itemStyle: { color: "#6090c0" }
    },
    {
      name: "Crisis",
      type: "bar",
      data: [15,90,75,50,35,45,30,80,60,40,95],
      barWidth: "35%",
      itemStyle: {
        color: "rgba(192,48,48,0.6)"
      }
    }
  ]
};

chart.setOption(option);
</script>

</body>
</html>
