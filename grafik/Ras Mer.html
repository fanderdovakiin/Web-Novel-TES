<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Empat Ras Mer — Tamriel</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    body {
      margin: 0;
      background-color: #040406;
      font-family: serif;
    }
    #chart {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="chart"></div>

<script>
  var chart = echarts.init(document.getElementById('chart'));

  var option = {
    backgroundColor: "#040406",
    title: {
      text: "Empat Ras Mer — Profil Perbandingan",
      subtext: "Altmer · Bosmer · Dunmer · Orsimer — sifat dan orientasi",
      left: "center",
      top: 10,
      textStyle: {
        color: "#c4a35a",
        fontFamily: "serif",
        fontSize: 14
      },
      subtextStyle: {
        color: "#806030",
        fontFamily: "serif",
        fontSize: 10,
        fontStyle: "italic"
      }
    },
    tooltip: {
      trigger: "axis",
      backgroundColor: "#080508",
      borderColor: "#c4a35a",
      textStyle: {
        color: "#e0d5c0",
        fontFamily: "serif",
        fontSize: 10
      }
    },
    legend: {
      data: ["Altmer", "Bosmer", "Dunmer", "Orsimer"],
      bottom: 8,
      textStyle: {
        color: "#aaa",
        fontFamily: "serif",
        fontSize: 10
      }
    },
    radar: {
      indicator: [
        {name: "Magical\nPower", max: 10},
        {name: "Combat\nStrength", max: 10},
        {name: "Cultural\nPreservation", max: 10},
        {name: "Nature\nConnection", max: 10},
        {name: "Survivability\nin Crisis", max: 10},
        {name: "Political\nInfluence", max: 10},
        {name: "Divine\nMemory", max: 10},
        {name: "Adaptability", max: 10}
      ],
      center: ["50%", "55%"],
      radius: "60%",
      axisName: {
        color: "#c4a35a",
        fontFamily: "serif",
        fontSize: 9
      },
      axisLine: {
        lineStyle: { color: "#2a2030" }
      },
      splitLine: {
        lineStyle: { color: "#1a1525" }
      },
      splitArea: {
        areaStyle: {
          color: ["rgba(8,8,12,0.5)", "rgba(12,12,18,0.5)"]
        }
      }
    },
    series: [
      {
        type: "radar",
        data: [
          {
            name: "Altmer",
            value: [10, 5, 9, 4, 5, 9, 10, 3],
            symbol: "circle",
            symbolSize: 6,
            lineStyle: {color: "#f5e08a", width: 2.5},
            areaStyle: {color: "rgba(245,224,138,0.12)"},
            itemStyle: {color: "#f5e08a"}
          },
          {
            name: "Bosmer",
            value: [5, 6, 8, 10, 8, 4, 5, 7],
            symbol: "diamond",
            symbolSize: 6,
            lineStyle: {color: "#80d050", width: 2.5},
            areaStyle: {color: "rgba(128,208,80,0.12)"},
            itemStyle: {color: "#80d050"}
          },
          {
            name: "Dunmer",
            value: [7, 7, 6, 5, 9, 6, 7, 6],
            symbol: "triangle",
            symbolSize: 6,
            lineStyle: {color: "#c060a0", width: 2.5},
            areaStyle: {color: "rgba(192,96,160,0.12)"},
            itemStyle: {color: "#c060a0"}
          },
          {
            name: "Orsimer",
            value: [3, 10, 4, 3, 10, 3, 2, 8],
            symbol: "rect",
            symbolSize: 6,
            lineStyle: {color: "#70c060", width: 2.5},
            areaStyle: {color: "rgba(112,192,96,0.12)"},
            itemStyle: {color: "#70c060"}
          }
        ]
      }
    ]
  };

  chart.setOption(option);

  window.addEventListener('resize', function () {
    chart.resize();
  });
</script>

</body>
</html>
