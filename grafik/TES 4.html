<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>TES IV Oblivion Chart</title>

  <!-- ECharts CDN -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #040208;
      font-family: serif;
    }

    #chart {
      width: 100%;
      height: 100vh; /* WAJIB biar chart muncul */
    }
  </style>
</head>
<body>

<div id="chart"></div>

<script>
  const chart = echarts.init(document.getElementById('chart'));

  const option = {
    backgroundColor: "#040208",

    title: {
      text: "TES IV: Oblivion — Quest Completion & Story Threads",
      subtext: "Seberapa setiap storyline berkontribusi pada gambaran besar",
      left: "center",
      top: 10,
      textStyle: {
        color: "#ff4400",
        fontFamily: "serif",
        fontSize: 14
      },
      subtextStyle: {
        color: "#cc2200",
        fontFamily: "serif",
        fontSize: 10,
        fontStyle: "italic"
      }
    },

    tooltip: {
      trigger: "item",
      backgroundColor: "#0a0305",
      borderColor: "#ff4400",
      textStyle: {
        color: "#e0d5c0",
        fontFamily: "serif",
        fontSize: 10
      }
    },

    series: [
      {
        type: "pie",
        radius: ["20%", "65%"],
        center: ["50%", "57%"],
        roseType: "area",

        label: {
          color: "#e0c0a0",
          fontFamily: "serif",
          fontSize: 9,
          formatter: "{b}\n{d}%"
        },

        labelLine: {
          lineStyle: { color: "#555" }
        },

        itemStyle: {
          borderRadius: 5,
          borderColor: "#040208",
          borderWidth: 2
        },

        data: [
          {
            value: 28,
            name: "Main Quest\n(Oblivion Crisis)",
            itemStyle: {
              color: {
                type: "linear",
                x: 0, y: 0, x2: 0, y2: 1,
                colorStops: [
                  { offset: 0, color: "#ff4400" },
                  { offset: 1, color: "#881100" }
                ]
              }
            }
          },
          { value: 15, name: "Shivering Isles\n(DLC)", itemStyle: { color: "#9050d0" } },
          { value: 12, name: "Knights of Nine\n(DLC)", itemStyle: { color: "#c4a35a" } },
          { value: 12, name: "Dark Brotherhood", itemStyle: { color: "#804040" } },
          { value: 10, name: "Thieves Guild", itemStyle: { color: "#606060" } },
          { value: 10, name: "Mages Guild", itemStyle: { color: "#4070c0" } },
          { value: 8, name: "Fighters Guild", itemStyle: { color: "#a07040" } },
          { value: 5, name: "Daedric Quests\n(15 quests)", itemStyle: { color: "#803080" } }
        ]
      }
    ]
  };

  chart.setOption(option);

  // Responsive biar gak rusak saat resize
  window.addEventListener('resize', () => {
    chart.resize();
  });
</script>

</body>
</html>
