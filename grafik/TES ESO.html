<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESO Timeline Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #040406;
    }
    #chart {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="chart"></div>

<script>
var chart = echarts.init(document.getElementById('chart'));

var option = {
  baseOption: {
    backgroundColor: "#040406",

    timeline: {
      axisType: 'category',
      autoPlay: false,
      data: [
        "2014","2015","2016","2017","2018",
        "2019","2020","2021","2022","2023","2024"
      ],
      label: {
        color: "#8060a0"
      },
      lineStyle: {
        color: "#403060"
      },
      itemStyle: {
        color: "#6040a0"
      },
      checkpointStyle: {
        color: "#c060c0",
        borderColor: "#8040a0"
      }
    },

    title: {
      text: "ESO Chapters — Ekspansi Lore dan Area Geographic",
      subtext: "Setiap Chapter membuka wilayah baru dan menambah lapisan lore",
      left: "center",
      top: 10,
      textStyle: {
        color: "#8060a0",
        fontFamily: "serif",
        fontSize: 14
      },
      subtextStyle: {
        color: "#604080",
        fontSize: 10,
        fontStyle: "italic"
      }
    },

    tooltip: {
      trigger: "axis",
      backgroundColor: "#080510",
      borderColor: "#8060a0",
      textStyle: {
        color: "#e0d5c0"
      }
    },

    grid: {
      left: "12%",
      right: "5%",
      top: "20%",
      bottom: "15%"
    },

    xAxis: {
      type: "category",
      data: [
        "2014\nBase", "2015\nDLCs", "2016\nOneTamriel",
        "2017\nMorrowind", "2018\nSummerset",
        "2019\nElsweyr", "2020\nGreymoor",
        "2021\nBlackwood", "2022\nHighIsle",
        "2023\nNecrom", "2024\nGoldRoad"
      ],
      axisLabel: { color: "#8060a0" },
      axisLine: { lineStyle: { color: "#2a2030" } }
    },

    yAxis: {
      type: "value",
      name: "Lore Significance (0-100)",
      nameTextStyle: { color: "#604080" },
      axisLabel: { color: "#604080" },
      axisLine: { lineStyle: { color: "#2a2030" } },
      splitLine: { lineStyle: { color: "#111" } }
    },

    series: [{
      name: "Lore Depth",
      type: "bar",
      data: [],
      itemStyle: {
        color: {
          type: "linear",
          x: 0, y: 0, x2: 0, y2: 1,
          colorStops: [
            { offset: 0, color: "#c060c0" },
            { offset: 1, color: "#401060" }
          ]
        }
      }
    }]
  },

  options: [
    { series: [{ data: [70] }] },
    { series: [{ data: [70,40] }] },
    { series: [{ data: [70,40,45] }] },
    { series: [{ data: [70,40,45,85] }] },
    { series: [{ data: [70,40,45,85,80] }] },
    { series: [{ data: [70,40,45,85,80,78] }] },
    { series: [{ data: [70,40,45,85,80,78,72] }] },
    { series: [{ data: [70,40,45,85,80,78,72,82] }] },
    { series: [{ data: [70,40,45,85,80,78,72,82,65] }] },
    { series: [{ data: [70,40,45,85,80,78,72,82,65,88] }] },
    { series: [{ data: [70,40,45,85,80,78,72,82,65,88,75] }] }
  ]
};

chart.setOption(option);
</script>

</body>
</html>
