<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Nirn Knowledge Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5"></script>
  <style>
    body {
      margin: 0;
      background: #040508;
      font-family: Georgia, serif;
    }

    #chart {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="chart"></div>

<script>
const chart = echarts.init(document.getElementById('chart'));

const option = {
  backgroundColor: "#040508",

  title: {
    text: "Benua-Benua Nirn",
    subtext: "Apa yang diketahui vs yang tidak diketahui",
    left: "center",
    top: 10,
    textStyle: {
      color: "#c4a35a",
      fontFamily: "Georgia, serif",
      fontSize: 16
    },
    subtextStyle: {
      color: "#806030",
      fontFamily: "Georgia, serif",
      fontSize: 11
    }
  },

  tooltip: {
    trigger: "item",
    backgroundColor: "#080510",
    textStyle: {
      color: "#e0d5c0",
      fontFamily: "Georgia, serif"
    }
  },

  legend: {
    bottom: 10,
    textStyle: {
      color: "#aaa",
      fontFamily: "Georgia, serif"
    }
  },

  /* PIE KIRI */
  series: [
    {
      name: "Knowledge",
      type: "pie",
      radius: ["25%", "55%"],
      center: ["30%", "55%"],
      roseType: "radius",

      label: {
        color: "#c4a35a",
        fontSize: 11,
        formatter: "{b}\n{d}%"
      },

      labelLine: {
        length: 10,
        length2: 8
      },

      data: [
        { name: "Tamriel", value: 40, itemStyle: { color: "#4a6040" } },
        { name: "Akavir", value: 20, itemStyle: { color: "#3a5080" } },
        { name: "Atmora", value: 12, itemStyle: { color: "#3a4565" } },
        { name: "Yokuda", value: 10, itemStyle: { color: "#705030" } },
        { name: "Pyandonea", value: 8, itemStyle: { color: "#253048" } },
        { name: "Islands", value: 5, itemStyle: { color: "#403535" } },
        { name: "Unknown", value: 5, itemStyle: { color: "#111115" } }
      ]
    },

    /* RING LUAR (DEKORASI) */
    {
      type: "pie",
      radius: ["60%", "70%"],
      center: ["30%", "55%"],
      silent: true,
      label: { show: false },
      data: [
        { value: 10, itemStyle: { color: "#2a3520", opacity: 0.5 } },
        { value: 25, itemStyle: { color: "#c04020", opacity: 0.4 } },
        { value: 20, itemStyle: { color: "#c08020", opacity: 0.3 } },
        { value: 15, itemStyle: { color: "#804020", opacity: 0.4 } },
        { value: 15, itemStyle: { color: "#204060", opacity: 0.35 } },
        { value: 10, itemStyle: { color: "#602020", opacity: 0.3 } },
        { value: 5, itemStyle: { color: "#080810", opacity: 0.5 } }
      ]
    },

    /* BAR KANAN */
    {
      name: "Known Facts",
      type: "bar",
      xAxisIndex: 0,
      yAxisIndex: 0,
      data: [95, 35, 45, 30, 15, 25],

      itemStyle: {
        color: "#c4a35a"
      },

      barWidth: "40%"
    }
  ],

  /* GRID BAR */
  grid: {
    left: "55%",
    right: "5%",
    top: "20%",
    bottom: "15%"
  },

  xAxis: {
    type: "category",
    data: ["Tamriel","Akavir","Atmora","Yokuda","Pyandonea","Islands"],
    axisLabel: {
      color: "#c4a35a",
      fontSize: 11
    },
    axisLine: {
      lineStyle: { color: "#2a2030" }
    }
  },

  yAxis: {
    type: "value",
    max: 100,
    name: "Knowledge %",
    nameTextStyle: {
      color: "#806030"
    },
    axisLabel: {
      color: "#888"
    },
    splitLine: {
      lineStyle: { color: "#111" }
    }
  }
};

chart.setOption(option);

/* RESPONSIVE FIX */
window.addEventListener('resize', () => {
  chart.resize();
});
</script>

</body>
</html>
