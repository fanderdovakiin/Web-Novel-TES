<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dawnguard Tree</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #050210;
      font-family: serif;
    }
    #chart {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="chart"></div>

<script>
const chart = echarts.init(document.getElementById('chart'));

const option = {
  backgroundColor: "#050210",

  title: {
    text: "Dawnguard DLC — Alur Cerita dan Pilihan Utama",
    subtext: "Dua jalur utama: Dawnguard vs Vampire",
    left: "center",
    textStyle: { color: "#c4a35a", fontFamily: "serif" },
    subtextStyle: { color: "#806030", fontStyle: "italic", fontFamily: "serif" }
  },

  tooltip: {
    trigger: "item",
    backgroundColor: "#080218",
    borderColor: "#8030a0",
    textStyle: { color: "#e0d5c0", fontFamily: "serif" }
  },

  series: [{
    type: "tree",
    orient: "LR",

    top: "10%",
    left: "5%",
    bottom: "10%",
    right: "20%",

    symbolSize: 10,

    label: {
      position: "right",
      verticalAlign: "middle",
      align: "left",
      fontSize: 10,
      color: "#ddd",
      overflow: "break",
      width: 90,
      lineHeight: 14
    },

    leaves: {
      label: {
        position: "right",
        color: "#aaa",
        overflow: "break",
        width: 90
      }
    },

    lineStyle: {
      color: "#2a1540",
      width: 1.5,
      curveness: 0.4,
      opacity: 0.7
    },

    expandAndCollapse: false,

    data: [{
      name: "DAWNGUARD DLC",
      itemStyle: {color:"#888"},
      children: [
        {
          name: "Dimhollow Crypt",
          itemStyle:{color:"#c060a0"},
          children: [
            {
              name: "Serana Freed\n(Elder Scroll)",
              itemStyle:{color:"#e080c0"},
              children: [

                // DAWNGUARD PATH
                {
                  name: "JOIN DAWNGUARD",
                  itemStyle:{color:"#c4a35a"},
                  children: [
                    {name:"Fort Dawnguard\n(Isran)", itemStyle:{color:"#b09040"}},
                    {name:"Soul Cairn\n(Valerica)", itemStyle:{color:"#4060a0"}},
                    {name:"Forgotten Vale\n(Gelebor)", itemStyle:{color:"#a0c0d0"}},
                    {name:"Auriel's Bow", itemStyle:{color:"#f5e08a"}},
                    {name:"Attack Volkihar", itemStyle:{color:"#c04020"}},
                    {name:"Harkon Defeated", itemStyle:{color:"#ff4400"}}
                  ]
                },

                // VAMPIRE PATH
                {
                  name: "JOIN VAMPIRES",
                  itemStyle:{color:"#6020a0"},
                  children: [
                    {name:"Castle Volkihar", itemStyle:{color:"#501090"}},
                    {name:"Harkon's Plan", itemStyle:{color:"#8020c0"}},
                    {name:"Soul Cairn\n(Valerica)", itemStyle:{color:"#4060a0"}},
                    {name:"Forgotten Vale\n(Gelebor)", itemStyle:{color:"#a0c0d0"}},
                    {name:"Auriel's Bow", itemStyle:{color:"#f5e08a"}},
                    {name:"Betray Harkon", itemStyle:{color:"#c04020"}},
                    {name:"Harkon Defeated", itemStyle:{color:"#ff4400"}}
                  ]
                },

                // OPTIONAL
                {
                  name: "Serana's Fate?",
                  itemStyle:{color:"#808080"},
                  children: [
                    {name:"Cured", itemStyle:{color:"#c0c0c0"}},
                    {name:"Remains Vampire", itemStyle:{color:"#404040"}}
                  ]
                }

              ]
            }
          ]
        }
      ]
    }]
  }]
};

chart.setOption(option);
window.addEventListener('resize', () => chart.resize());
</script>

</body>
</html>
