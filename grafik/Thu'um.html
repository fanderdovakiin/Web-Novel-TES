<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafik Dragon Shouts</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent; /* Latar transparan agar menyatu dengan webnovel */
            overflow: hidden;
        }
        #chart-container {
            width: 100%;
            height: 600px; /* Dibuat sedikit lebih tinggi agar lingkaran Sunburst tidak bertabrakan */
        }
    </style>
</head>
<body>

    <div id="chart-container"></div>

    <script>
        var chartDom = document.getElementById('chart-container');
        var myChart = echarts.init(chartDom);
        var option;

        option = {
            backgroundColor: "transparent",
            title: {
                text: "20 Dragon Shouts — Utility & Power Profile",
                subtext: "Kategorisasi berdasarkan fungsi dan tingkat kekuatan lore",
                left: "center",
                top: 10,
                textStyle: {
                    color: "#80a0d0", // Biru es Skyrim
                    fontFamily: "'Cinzel', serif",
                    fontSize: 18,
                    fontWeight: "bold",
                    textShadowBlur: 5,
                    textShadowColor: "rgba(0,0,0,0.5)"
                },
                subtextStyle: {
                    color: "#5080a0",
                    fontFamily: "'Merriweather', serif",
                    fontSize: 12,
                    fontStyle: "italic"
                }
            },
            tooltip: {
                trigger: "item",
                backgroundColor: "rgba(8, 5, 16, 0.9)",
                borderColor: "#80a0d0",
                textStyle: {
                    color: "#e0d5c0",
                    fontFamily: "'Poppins', sans-serif",
                    fontSize: 12
                }
            },
            series: [
                {
                    type: "sunburst",
                    radius: ["15%", "80%"], // Disesuaikan agar lebih proporsional
                    center: ["50%", "55%"],
                    data: [
                        {
                            name: "COMBAT",
                            value: 1,
                            itemStyle: {"color": "#c04020"},
                            label: {"color": "#ff6040", "fontFamily": "'Cinzel', serif", "fontSize": 12, "fontWeight": "bold"},
                            children: [
                                { name: "Unrelenting Force\nFUS RO DAH", value: 10, itemStyle: {"color": "#d05030"} },
                                { name: "Fire Breath\nYOL TOOR SHUL", value: 9, itemStyle: {"color": "#c04020"} },
                                { name: "Frost Breath\nFO KRAH DIIN", value: 8, itemStyle: {"color": "#80a0c0"} },
                                { name: "Storm Call\nSTRUN BAH QO", value: 9, itemStyle: {"color": "#d0d040"} },
                                { name: "Marked for Death\nKRII LUN AUS", value: 7, itemStyle: {"color": "#a03010"} },
                                { name: "Ice Form\nIIZ SLEN NUS", value: 7, itemStyle: {"color": "#6080b0"} }
                            ]
                        },
                        {
                            name: "UTILITY",
                            value: 1,
                            itemStyle: {"color": "#30a060"},
                            label: {"color": "#50c080", "fontFamily": "'Cinzel', serif", "fontSize": 12, "fontWeight": "bold"},
                            children: [
                                { name: "Whirlwind Sprint\nWULD NAH KEST", value: 7, itemStyle: {"color": "#3080a0"} },
                                { name: "Clear Skies\nLOK VAH KOOR", value: 6, itemStyle: {"color": "#c0a040"} },
                                { name: "Become Ethereal\nFEIM ZII GRON", value: 8, itemStyle: {"color": "#40a060"} },
                                { name: "Aura Whisper\nLAAS YAH NIR", value: 6, itemStyle: {"color": "#a0c040"} },
                                { name: "Throw Voice\nZUL MEY GUT", value: 5, itemStyle: {"color": "#8060a0"} }
                            ]
                        },
                        {
                            name: "DRAGON",
                            value: 1,
                            itemStyle: {"color": "#c060c0"},
                            label: {"color": "#e080e0", "fontFamily": "'Cinzel', serif", "fontSize": 12, "fontWeight": "bold"},
                            children: [
                                { name: "Dragonrend\nJOOR ZAH FRUL", value: 10, itemStyle: {"color": "#c040a0"} },
                                { name: "Call Dragon\nOD AH VIING", value: 8, itemStyle: {"color": "#a040c0"} },
                                { name: "Bend Will (DB)\nGOL HA DOV", value: 9, itemStyle: {"color": "#8040c0"} },
                                { name: "Soul Tear (DG)\nRII VAAZ ZOL", value: 8, itemStyle: {"color": "#6040c0"} },
                                { name: "Summon Durnehviir\nDUR NEH VIIR", value: 8, itemStyle: {"color": "#4060c0"} }
                            ]
                        },
                        {
                            name: "POWER",
                            value: 1,
                            itemStyle: {"color": "#c0a030"},
                            label: {"color": "#e0c050", "fontFamily": "'Cinzel', serif", "fontSize": 12, "fontWeight": "bold"},
                            children: [
                                { name: "Slow Time\nTIID KLO UL", value: 9, itemStyle: {"color": "#c08030"} },
                                { name: "Call of Valor\nHUN KAAL ZOOR", value: 8, itemStyle: {"color": "#d04040"} },
                                { name: "Dismay\nFAAS RU MAAR", value: 6, itemStyle: {"color": "#a06020"} },
                                { name: "Animal Allegiance\nRAN MIR TAH", value: 5, itemStyle: {"color": "#60a040"} }
                            ]
                        }
                    ],
                    label: {
                        rotate: "radial",
                        fontFamily: "'Merriweather', serif", // Font elegan untuk nama shout
                        fontSize: 10,
                        color: "#ffffff",
                        textShadowBlur: 2,
                        textShadowColor: "rgba(0,0,0,0.8)"
                    },
                    levels: [
                        {},
                        {
                            r0: "15%", r: "35%",
                            label: {rotate: "tangential", fontSize: 12, fontWeight: "bold"},
                            itemStyle: {borderWidth: 2, borderColor: "rgba(255,255,255,0.1)"} // Border halus menyatu dengan tema gelap/terang
                        },
                        {
                            r0: "35%", r: "80%",
                            label: {align: "right", rotate: "radial", fontSize: 10},
                            itemStyle: {borderWidth: 2, borderColor: "rgba(255,255,255,0.1)"}
                        }
                    ]
                }
            ]
        };

        option && myChart.setOption(option);

        // Responsif saat layar berubah ukuran
        window.addEventListener('resize', function() {
            myChart.resize();
        });
    </script>
</body>
</html>
