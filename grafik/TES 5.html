<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Skyrim Questlines Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #040608;
      font-family: serif;
    }
    #chart {
      width: 100%;
      height: 600px; /* WAJIB ADA */
    }
  </style>
</head>
<body>

<div id="chart"></div>

<script>
  const chart = echarts.init(document.getElementById('chart'));

  const option = {
    backgroundColor: "#040608",

    title: {
      text: "Skyrim — Semua Questlines: Durasi & Kompleksitas",
      subtext: "Perbandingan panjang dan kedalaman moral setiap questline utama",
      left: "center",
      top: 10,
      textStyle: {
        color: "#c4a35a",
        fontFamily: "serif",
        fontSize: 14
      },
      subtextStyle: {
        color: "#806030",
        fontFamily: "serif",
        fontSize: 10,
        fontStyle: "italic"
      }
    },

    tooltip: {
      trigger: "axis",
      backgroundColor: "#080510",
      borderColor: "#c4a35a",
      textStyle: {
        color: "#e0d5c0",
        fontFamily: "serif",
        fontSize: 10
      },
      axisPointer: { type: "shadow" }
    },

    legend: {
      data: ["Quest Count", "Avg Hours", "Moral Complexity (0-10)", "Lore Depth (0-10)"],
      bottom: 8,
      textStyle: {
        color: "#aaa",
        fontFamily: "serif",
        fontSize: 9
      }
    },

    grid: {
      left: "18%",
      right: "5%",
      top: "18%",
      bottom: "18%"
    },

    xAxis: {
      type: "value",
      axisLabel: { color: "#666", fontFamily: "serif" },
      axisLine: { lineStyle: { color: "#2a2030" } },
      splitLine: { lineStyle: { color: "#111" } }
    },

    yAxis: {
      type: "category",
      data: [
        "Daedric Quests (15)",
        "Civil War",
        "Dark Brotherhood",
        "Thieves Guild",
        "College of Winterhold",
        "Companions",
        "Main Quest"
      ],
      axisLabel: {
        color: "#c4a35a",
        fontFamily: "serif",
        fontSize: 9
      },
      axisLine: { lineStyle: { color: "#2a2030" } }
    },

    series: [
      {
        name: "Quest Count",
        type: "bar",
        data: [15, 10, 12, 10, 8, 8, 15],
        barWidth: "15%"
      },
      {
        name: "Avg Hours",
        type: "bar",
        data: [25, 6, 8, 7, 5, 5, 12],
        barWidth: "15%"
      },
      {
        name: "Moral Complexity (0-10)",
        type: "bar",
        data: [9, 8, 9, 7, 5, 6, 7],
        barWidth: "15%"
      },
      {
        name: "Lore Depth (0-10)",
        type: "bar",
        data: [8, 7, 7, 7, 8, 6, 10],
        barWidth: "15%"
      }
    ]
  };

  chart.setOption(option);

  window.addEventListener('resize', () => chart.resize());
</script>

</body>
</html>
