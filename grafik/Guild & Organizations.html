<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Guilds Tamriel</title>

  <!-- ECharts CDN -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #040406;
      font-family: serif;
    }

    #chart {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="chart"></div>

<script>
  const chart = echarts.init(document.getElementById('chart'));

  const option = {
    backgroundColor: "#040406",

    title: {
      text: "Guilds Tamriel — Usia, Kekuatan, dan Pengaruh",
      subtext: "Perbandingan organisasi utama berdasarkan berbagai metrik",
      left: "center",
      top: 10,
      textStyle: {
        color: "#c4a35a",
        fontFamily: "serif",
        fontSize: 14
      },
      subtextStyle: {
        color: "#806030",
        fontFamily: "serif",
        fontSize: 10,
        fontStyle: "italic"
      }
    },

    tooltip: {
      trigger: "item",
      backgroundColor: "#080510",
      borderColor: "#c4a35a",
      textStyle: {
        color: "#e0d5c0",
        fontFamily: "serif",
        fontSize: 10
      }
    },

    legend: {
      bottom: 8,
      textStyle: {
        color: "#aaa",
        fontFamily: "serif",
        fontSize: 9
      },
      data: [
        "Dark Brotherhood",
        "Thieves Guild",
        "Companions",
        "Thalmor",
        "Psijic Order"
      ]
    },

    radar: {
      indicator: [
        {name: "Age\n(centuries)", max: 40},
        {name: "Political\nInfluence", max: 10},
        {name: "Moral\nAmbiguity", max: 10},
        {name: "Survival\nRate", max: 10},
        {name: "Members\nCount", max: 10},
        {name: "Geographical\nSpread", max: 10},
        {name: "Power\nLevel", max: 10}
      ],
      center: ["50%", "58%"],
      radius: "60%",

      axisName: {
        color: "#c4a35a",
        fontFamily: "serif",
        fontSize: 9
      },

      axisLine: { lineStyle: { color: "#2a2030" } },
      splitLine: { lineStyle: { color: "#1a1525" } },
      splitArea: {
        areaStyle: {
          color: ["rgba(8,6,12,0.5)", "rgba(12,10,18,0.5)"]
        }
      }
    },

    series: [
      {
        type: "radar",
        data: [
          {
            name: "Dark Brotherhood",
            value: [26, 6, 10, 6, 4, 8, 7],
            lineStyle: { color: "#c04040" },
            areaStyle: { color: "rgba(192,64,64,0.15)" }
          },
          {
            name: "Thieves Guild",
            value: [38, 5, 8, 8, 7, 9, 6],
            lineStyle: { color: "#909090" },
            areaStyle: { color: "rgba(144,144,144,0.15)" }
          },
          {
            name: "Companions",
            value: [35, 4, 3, 9, 5, 5, 8],
            lineStyle: { color: "#c09060" },
            areaStyle: { color: "rgba(192,144,96,0.15)" }
          },
          {
            name: "Thalmor",
            value: [8, 10, 9, 7, 8, 9, 10],
            lineStyle: { color: "#d0b030", type: "dashed" },
            areaStyle: { color: "rgba(208,176,48,0.15)" }
          },
          {
            name: "Psijic Order",
            value: [40, 5, 4, 10, 2, 3, 9],
            lineStyle: { color: "#80c0c0" },
            areaStyle: { color: "rgba(128,192,192,0.15)" }
          }
        ]
      }
    ]
  };

  chart.setOption(option);

  window.addEventListener('resize', () => chart.resize());
</script>

</body>
</html>
