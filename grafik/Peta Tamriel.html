<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Perbandingan Provinsi Tamriel</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

<style>
  body {
    margin: 0;
    background: #050810;
    font-family: Georgia, "Times New Roman", serif;
  }

  #chart {
    width: 100%;
    height: 100vh;
  }
</style>
</head>

<body>
<div id="chart"></div>

<script>
var chart = echarts.init(document.getElementById('chart'));

var option = {
  backgroundColor: "#050810",

  title: {
    text: "Perbandingan Provinsi-Provinsi Tamriel",
    subtext: "Luas, populasi, dan kekuatan ekonomi (estimasi 4E 200)",
    left: "center",
    top: 10,
    textStyle: {
      color: "#c4a35a",
      fontFamily: "Georgia, serif",
      fontSize: 16
    },
    subtextStyle: {
      color: "#806030",
      fontFamily: "Georgia, serif",
      fontSize: 11,
      fontStyle: "italic"
    }
  },

  tooltip: {
    trigger: "axis",
    backgroundColor: "#080510",
    borderColor: "#c4a35a",
    textStyle: {
      color: "#e0d5c0",
      fontFamily: "Georgia, serif",
      fontSize: 11
    },
    axisPointer: { type: "shadow" }
  },

  legend: {
    bottom: 10,
    textStyle: {
      color: "#aaa",
      fontFamily: "Georgia, serif",
      fontSize: 10
    }
  },

  grid: {
    left: "10%",
    right: "5%",
    top: "22%",
    bottom: "18%"
  },

  xAxis: {
    type: "category",
    data: [
      "Skyrim", "High Rock", "Hammerfell", "Cyrodiil",
      "Morrowind", "Black Marsh", "Elsweyr",
      "Valenwood", "Summerset"
    ],
    axisLabel: {
      color: "#c4a35a",
      fontFamily: "Georgia, serif",
      fontSize: 10,
      interval: 0,
      rotate: 20   // 🔥 biar tidak numpuk
    },
    axisLine: {
      lineStyle: { color: "#2a1a10" }
    }
  },

  yAxis: {
    type: "value",
    max: 100,
    axisLabel: {
      color: "#777",
      fontFamily: "Georgia, serif"
    },
    axisLine: {
      lineStyle: { color: "#2a1a10" }
    },
    splitLine: {
      lineStyle: { color: "#111" }
    }
  },

  series: [
    {
      name: "Luas",
      type: "bar",
      data: [75,45,65,80,70,60,55,50,40],
      barWidth: "18%",
      itemStyle: { color: "#6090c0" }
    },
    {
      name: "Populasi",
      type: "bar",
      data: [55,70,50,90,45,40,60,35,65],
      barWidth: "18%",
      itemStyle: { color: "#c4a35a" }
    },
    {
      name: "Ekonomi",
      type: "bar",
      data: [45,75,60,95,35,25,55,40,85],
      barWidth: "18%",
      itemStyle: { color: "#60a040" }
    }
  ]
};

chart.setOption(option);

// RESPONSIVE
window.addEventListener('resize', function () {
  chart.resize();
});
</script>

</body>
</html>
