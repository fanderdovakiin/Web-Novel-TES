<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Empat Ras Manusia — Tamriel</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    body {
      margin: 0;
      background-color: #040406;
      font-family: serif;
    }
    #chart {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="chart"></div>

<script>
  var chart = echarts.init(document.getElementById('chart'));

  var option = {
    backgroundColor: "#040406",
    title: {
      text: "Empat Ras Manusia — Profil Statistik Perbandingan",
      subtext: "Kemampuan, budaya, dan orientasi (perkiraan lore, bukan data game mechanics)",
      left: "center",
      top: 10,
      textStyle: {
        color: "#c4a35a",
        fontFamily: "serif",
        fontSize: 14
      },
      subtextStyle: {
        color: "#806030",
        fontFamily: "serif",
        fontSize: 10,
        fontStyle: "italic"
      }
    },
    tooltip: {
      trigger: "axis",
      backgroundColor: "#080510",
      borderColor: "#c4a35a",
      textStyle: {
        color: "#e0d5c0",
        fontFamily: "serif",
        fontSize: 10
      }
    },
    legend: {
      data: ["Imperial", "Nord", "Breton", "Redguard"],
      bottom: 8,
      textStyle: {
        color: "#aaa",
        fontFamily: "serif",
        fontSize: 10
      }
    },
    radar: {
      indicator: [
        {name: "Combat\nStrength", max: 10},
        {name: "Magical\nAffinity", max: 10},
        {name: "Diplomatic\nSkill", max: 10},
        {name: "Cultural\nIdentity", max: 10},
        {name: "Adaptability", max: 10},
        {name: "Environmental\nSurvival", max: 10},
        {name: "Economic\nAcumen", max: 10},
        {name: "Military\nOrganization", max: 10}
      ],
      center: ["50%", "55%"],
      radius: "60%",
      axisName: {
        color: "#c4a35a",
        fontFamily: "serif",
        fontSize: 9
      },
      axisLine: {
        lineStyle: { color: "#2a2030" }
      },
      splitLine: {
        lineStyle: { color: "#1a1525" }
      },
      splitArea: {
        areaStyle: {
          color: ["rgba(8,8,12,0.5)", "rgba(12,12,18,0.5)"]
        }
      }
    },
    series: [
      {
        type: "radar",
        data: [
          {
            name: "Imperial",
            value: [6, 6, 9, 7, 10, 6, 9, 8],
            symbol: "circle",
            symbolSize: 6,
            lineStyle: {color: "#c4a35a", width: 2.5},
            areaStyle: {color: "rgba(196,163,90,0.15)"},
            itemStyle: {color: "#c4a35a"}
          },
          {
            name: "Nord",
            value: [10, 4, 5, 9, 6, 9, 4, 7],
            symbol: "diamond",
            symbolSize: 6,
            lineStyle: {color: "#6090c0", width: 2.5},
            areaStyle: {color: "rgba(96,144,192,0.15)"},
            itemStyle: {color: "#6090c0"}
          },
          {
            name: "Breton",
            value: [5, 9, 8, 6, 8, 5, 7, 6],
            symbol: "triangle",
            symbolSize: 6,
            lineStyle: {color: "#a0a0d0", width: 2.5},
            areaStyle: {color: "rgba(160,160,208,0.15)"},
            itemStyle: {color: "#a0a0d0"}
          },
          {
            name: "Redguard",
            value: [9, 4, 6, 10, 7, 8, 5, 7],
            symbol: "rect",
            symbolSize: 6,
            lineStyle: {color: "#d09040", width: 2.5},
            areaStyle: {color: "rgba(208,144,64,0.15)"},
            itemStyle: {color: "#d09040"}
          }
        ]
      }
    ]
  };

  chart.setOption(option);

  window.addEventListener('resize', function () {
    chart.resize();
  });
</script>

</body>
</html>
