<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Prophecy Timeline - Tamriel</title>

  <!-- ECharts CDN -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #040408;
      font-family: serif;
    }

    #chart {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="chart"></div>

<script>
  const chart = echarts.init(document.getElementById('chart'));

  const option = {
    backgroundColor: "#040408",

    title: {
      text: "Nubuat-Nubuat Besar Tamriel — Garis Waktu dan Pemenuhan",
      subtext: "Dari pengucapan hingga pemenuhan — era mana yang menunggu paling lama",
      left: "center",
      top: 10,
      textStyle: {
        color: "#f0e8d0",
        fontFamily: "serif",
        fontSize: 14
      },
      subtextStyle: {
        color: "#c0a880",
        fontFamily: "serif",
        fontSize: 10,
        fontStyle: "italic"
      }
    },

    tooltip: {
      trigger: "item",
      backgroundColor: "#080510",
      borderColor: "#f0e8d0",
      textStyle: {
        color: "#e0d5c0",
        fontFamily: "serif",
        fontSize: 10
      }
    },

    grid: {
      left: "10%",
      right: "5%",
      top: "18%",
      bottom: "20%"
    },

    xAxis: {
      type: "value",
      name: "Year (negative = years before 1E)",
      nameLocation: "middle",
      nameGap: 30,
      min: -800,
      max: 4300,
      nameTextStyle: {
        color: "#c0a880",
        fontFamily: "serif",
        fontSize: 9
      },
      axisLabel: {
        color: "#c0a880",
        fontFamily: "serif",
        fontSize: 8,
        formatter: function (val) {
          if (val < 0) return "ME " + Math.abs(val);
          if (val < 1000) return "1E " + val;
          if (val < 2000) return "2E " + (val - 1000);
          if (val < 3000) return "3E " + (val - 2000);
          return "4E " + (val - 3000);
        }
      },
      axisLine: { lineStyle: { color: "#2a2030" } },
      splitLine: { lineStyle: { color: "#111" } }
    },

    yAxis: {
      type: "value",
      name: "Impact Scale (1-10)",
      max: 12,
      nameTextStyle: {
        color: "#c0a880",
        fontFamily: "serif",
        fontSize: 9
      },
      axisLabel: {
        color: "#806040",
        fontFamily: "serif"
      },
      axisLine: { lineStyle: { color: "#2a2030" } },
      splitLine: { lineStyle: { color: "#111" } }
    },

    series: [
      {
        type: "scatter",
        name: "Prophecy Events",

        data: [
          { value: [-700, 8], name: "Nerevarine Prophecy spoken\n(1E ~700)" },
          { value: [3427, 10], name: "Nerevarine fulfilled\n(3E 427)" },
          { value: [-200, 6], name: "Alduin's Wall created" },
          { value: [4201, 10], name: "Alduin defeated\n(4E 201)" },
          { value: [3000, 5], name: "Oblivion warnings begin" },
          { value: [3433, 10], name: "Oblivion Crisis\n(3E 433)" },
          { value: [3580, 7], name: "Planemeld (ESO)" },
          { value: [1000, 4], name: "Void Night prophecy" }
        ],

        symbolSize: function (data) {
          return data[1] * 2; // ukuran berdasarkan impact
        },

        label: {
          show: true,
          position: "top",
          color: "#c0a880",
          fontFamily: "serif",
          fontSize: 8,
          formatter: function (params) {
            return params.data.name;
          }
        },

        itemStyle: {
          color: function (params) {
            const colors = [
              "#c060c0","#e080e0","#cc2200","#ff4400",
              "#8060c0","#a080e0","#6030a0","#d09040"
            ];
            return colors[params.dataIndex];
          }
        },

        emphasis: {
          scale: 1.4
        }
      }
    ]
  };

  chart.setOption(option);

  window.addEventListener('resize', () => {
    chart.resize();
  });
</script>

</body>
</html>
