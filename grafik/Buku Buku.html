<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>TES Books Chart</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

<style>
body {
  margin: 0;
  background: #040406;
  font-family: serif;
}
#chart {
  width: 100%;
  height: 100vh;
}
</style>
</head>

<body>
<div id="chart"></div>

<script>
const chart = echarts.init(document.getElementById('chart'));

const option = {
  backgroundColor: "#040406",

  title: {
    text: "Buku-Buku TES — Distribusi Genre dan Signifikansi",
    subtext: "Korpus literatur in-game terbesar dalam sejarah gaming",
    left: "center",
    top: 10,
    textStyle: {
      color: "#c4a35a",
      fontFamily: "serif",
      fontSize: 14
    },
    subtextStyle: {
      color: "#806030",
      fontFamily: "serif",
      fontSize: 10,
      fontStyle: "italic"
    }
  },

  tooltip: {
    trigger: "item",
    backgroundColor: "#080510",
    borderColor: "#c4a35a",
    textStyle: {
      color: "#e0d5c0",
      fontFamily: "serif",
      fontSize: 10
    }
  },

  // GRID UNTUK BAR
  grid: {
    left: "50%",
    right: "5%",
    top: "20%",
    bottom: "10%"
  },

  xAxis: {
    type: "value",
    max: 10,
    axisLabel: { color: "#888" },
    axisLine: { lineStyle: { color: "#2a2030" } },
    splitLine: { lineStyle: { color: "#111" } }
  },

  yAxis: {
    type: "category",
    data: [
      "36 Lessons of Vivec",
      "The Real Barenziah",
      "2920 Last Year",
      "The Monomyth",
      "Before Ages of Man",
      "On Oblivion",
      "A Dance in Fire",
      "Mythic Dawn",
      "Pocket Guide",
      "Lusty Argonian"
    ],
    axisLabel: {
      color: "#c4a35a",
      fontSize: 9
    },
    axisLine: { lineStyle: { color: "#2a2030" } }
  },

  series: [

    // 🔥 PIE (KIRI)
    {
      type: "pie",
      radius: ["25%", "60%"],
      center: ["25%", "55%"],
      roseType: "area",

      label: {
        color: "#c4a35a",
        fontSize: 9,
        formatter: "{b}\n{c}"
      },

      data: [
        { value: 85, name: "History & Chronicles", itemStyle: { color: "#c4a35a" }},
        { value: 65, name: "Theology & Philosophy", itemStyle: { color: "#8060c0" }},
        { value: 55, name: "Fiction & Adventure", itemStyle: { color: "#60a040" }},
        { value: 45, name: "Practical Guides", itemStyle: { color: "#4080c0" }},
        { value: 40, name: "Magic & Alchemy", itemStyle: { color: "#c05050" }},
        { value: 35, name: "Racial Culture", itemStyle: { color: "#d09040" }},
        { value: 30, name: "Poetry & Song", itemStyle: { color: "#c060c0" }},
        { value: 25, name: "Scandal & Entertainment", itemStyle: { color: "#505050" }},
        { value: 20, name: "Scientific Treatises", itemStyle: { color: "#80a080" }}
      ]
    },

    // 📊 BAR (KANAN)
    {
      type: "bar",
      name: "Lore Importance",
      data: [9,8,8,7,7,7,6,6,5,3],

      label: {
        show: true,
        position: "right",
        color: "#c4a35a",
        fontSize: 9
      },

      itemStyle: {
        color: function(params) {
          const colors = [
            "#8060c0","#c05050","#c4a35a","#8060a0","#60a040",
            "#4080c0","#d08050","#cc2200","#a09060","#40a030"
          ];
          return colors[params.dataIndex];
        }
      }
    }

  ]
};

chart.setOption(option);
window.addEventListener("resize", () => chart.resize());
</script>

</body>
</html>
